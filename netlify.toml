[build]
  publish = "public"
  functions = "netlify/functions"

# API goes to the function (belt-and-braces alongside config.path)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# Anything not found goes to the home page
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
